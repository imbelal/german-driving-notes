<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>German Driving Notes — English notes for the German licence</title>
    <meta name="description" content="Clear English notes and diagrams for German driving lessons: junctions, left and right turns, U-turns, roundabouts, Autobahn merging, emergency braking and more." />
    <meta name="theme-color" content="#17334f" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('gdn-theme');
          var dark = saved ? saved === 'dark' : true;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0c141c' : '#17334f');
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
